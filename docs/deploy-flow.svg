<polyline class="edge" data-from="BuildFrontend" data-to="S3CF" data-style="solid" data-arrow-start="false" data-arrow-end="true" points="788.6309999999999,375.6 788.6309999999999,399.6 559.1434999999999,399.6 559.1434999999999,423.6" fill="none" stroke="var(--_line)" stroke-width="1" marker-end="url(#arrowhead)" />
