  <rect x="345.50849999999997" y="423.6" width="427.26999999999987" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="559.1434999999999" y="442.05" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">4. Sync dist/ to S3 with caching rules &amp; invalidate CloudFront cache</text>
</g>
<g class="node" data-id="Summary" data-label="5. Output deployment summary to GitHub Step Summary" data-shape="rectangle">
  <rect x="381.44699999999995" y="508.50000000000006" width="355.393" height="36.900000000000006" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="559.1434999999999" y="526.95" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">5. Output deployment summary to GitHub Step Summary</text>
