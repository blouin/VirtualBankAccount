  <text x="329.65599999999995" y="357.15000000000003" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">3. Terraform Init, Validate &amp; Apply (Creates/updates VPC, EFS, Lambda, S3, CloudFront)</text>
</g>
