<rect x="620" y="520" width="230" height="128" fill="#f4f4f4" stroke="#333" stroke-dasharray="5,3"/>
<rect x="620" y="520" width="230" height="28" fill="#fce5cd" stroke="#333"/>
<text x="735.0" y="539" text-anchor="middle" font-weight="bold" font-size="14">VIEW login_failures_15m</text>
<text x="628" y="563">kind: person | operator | ip</text>
<text x="628" y="583">key (id or ip)</text>
<text x="628" y="603">failures (last 15 min)</text>
