<polyline points="40,520 30,520 30,140 40,140" fill="none" stroke="#555" marker-end="url(#a)"/>
<polyline points="850,115 888,115 888,842 155,842 155,828" fill="none" stroke="#555" marker-end="url(#a)"/>
<polyline points="620,495 600,495 600,660 500,660 500,680" fill="none" stroke="#555" marker-end="url(#a)"/>
<text x="40" y="850" fill="#555">Arrows = FK (many -&gt; one). account_role has no direct arrow to family: its composite FKs (account_id, family_id)</text>
<text x="40" y="868" fill="#555">and (person_id, family_id) point at account and person and keep both in the same family. Triggers: manager-only deposit /</text>
<text x="40" y="886" fill="#555">approve / reject / skip a funding day; withdraw / request = any member; no overdraft; request decided once; approval</text>
<text x="40" y="904" fill="#555">inserts a deposit; an open account keeps 1 open manager; a closed account or family takes no transaction / request / skip / login.</text>
<text x="40" y="922" fill="#555">Rate limit: login_failures_15m view. Hourly job: for each family whose local time is 23:xx, a deposit with person_id NULL</text>
<text x="40" y="940" fill="#555">+ funding_date for each open account (of an open family) with daily_funding &gt; 0 and no funding_skip row that day; at most one per day.</text>
<rect x="40" y="960" width="14" height="14" fill="#cfe2f3" stroke="#333"/><text x="60" y="972">money</text>
<rect x="130" y="960" width="14" height="14" fill="#fce5cd" stroke="#333"/><text x="150" y="972">sessions, login and operator</text>
<rect x="340" y="960" width="14" height="14" fill="#d9ead3" stroke="#333"/><text x="360" y="972">tenant</text>
</svg>