<rect x="620" y="360" width="230" height="28" fill="#fce5cd" stroke="#333"/>
<text x="735.0" y="379" text-anchor="middle" font-weight="bold" font-size="14">login_attempt</text>
<text x="628" y="403">PK id</text>
<text x="628" y="423">FK person_id (nullable)</text>
<text x="628" y="443">FK operator_id (nullable)</text>
<text x="628" y="463">ip</text>
<text x="628" y="483">succeeded (0|1)</text>
<text x="628" y="503">attempted_at</text>
